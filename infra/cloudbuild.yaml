steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/guitar-tutor/backend:latest
      - .
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/guitar-tutor/backend:latest
options:
  logging: CLOUD_LOGGING_ONLY
